<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelPerfect Retouch | Creator & Influencer Editing Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0b0e;
      --bg-card: rgba(18, 20, 28, 0.75);
      --border-gradient: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(236, 72, 153, 0.5);
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --accent-glow: rgba(236, 72, 153, 0.2);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.7;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(236, 72, 153, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 45%);
      background-attachment: fixed;
    }

    header {
      padding: 120px 20px 70px 20px;
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-block;
      padding: 6px 20px;
      background: var(--accent-glow);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.3);
      border-radius: 50px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 25px;
      font-weight: 700;
    }

    header h1 {
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      margin: 0 0 15px 0;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    header h1 span {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 1.12rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      font-weight: 400;
      padding: 0 15px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .section-title {
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin-bottom: 45px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-title span {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-bottom: 90px;
    }

    .showcase-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      text-align: center;
    }

    .showcase-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
    }

    .ba-slider {
      position: relative;
      width: 100%;
      min-height: 280px;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      user-select: none;
      border-bottom: 1px solid var(--border-gradient);
      cursor: ew-resize;
      background: #12141c;
    }

    .ba-slider img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .ba-slider .before-img {
      z-index: 1;
    }

    .ba-slider .after-img {
      z-index: 2;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
      transition: none;
    }

    #slider1 .after-img {
      filter: brightness(1.15) contrast(1.08) saturate(1.25);
    }

    #slider3 .before-img {
      filter: saturate(1.7) contrast(1.25) brightness(1.12);
    }

    #slider3 .after-img {
      filter: saturate(0.3) brightness(0.85) contrast(0.85);
    }

    .ba-slider .slider-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background: #ffffff;
      z-index: 3;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
      transform: translateX(-50%);
    }

    .ba-slider .slider-handle::after {
      content: '↔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
    }

    .ba-label {
      position: absolute;
      bottom: 10px;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      z-index: 4;
      pointer-events: none;
      font-weight: 700;
    }

    .ba-label.before-lbl { left: 10px; }
    .ba-label.after-lbl { right: 10px; }

    .showcase-content {
      padding: 25px 20px;
    }

    .showcase-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .showcase-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.6;
    }

    .upload-section {
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 90px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      margin-bottom: 25px;
    }

    .upload-box {
      background: rgba(12, 14, 20, 0.7);
      border: 2px dashed var(--border-gradient);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .upload-box:hover {
      border-color: var(--accent-pink);
      background: rgba(236, 72, 153, 0.03);
    }

    .upload-box input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-box img {
      max-width: 100%;
      max-height: 140px;
      border-radius: 8px;
      object-fit: cover;
      display: none;
    }

    .upload-box .upload-placeholder {
      pointer-events: none;
    }

    .upload-box .upload-placeholder span {
      display: block;
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #f472b6;
    }

    .upload-box h4 {
      font-size: 1rem;
      margin: 0 0 5px 0;
      font-weight: 700;
    }

    .upload-box p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0;
    }

    .instructions-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 90px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .instructions-card h3 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 700;
    }

    .instructions-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .instruction-step {
      background: rgba(12, 14, 20, 0.7);
      border: 1px solid var(--border-gradient);
      border-radius: 16px;
      padding: 25px;
    }

    .instruction-step .step-num {
      display: inline-block;
      width: 32px;
      height: 32px;
      background: var(--accent-glow);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.3);
      border-radius: 50%;
      text-align: center;
      line-height: 30px;
      font-weight: 800;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .instruction-step h4 {
      font-size: 1.05rem;
      margin: 0 0 8px 0;
      font-weight: 700;
    }

    .instruction-step p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.6;
    }

    .highlight-return {
      color: #f472b6;
      font-weight: 600;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      margin-bottom: 90px;
      max-width: 950px;
      margin-left: auto;
      margin-right: auto;
    }

    .pricing-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
      position: relative;
      cursor: pointer;
    }

    .pricing-card.popular {
      border-color: var(--accent-pink);
      box-shadow: 0 15px 40px rgba(236, 72, 153, 0.15);
    }

    .popular-tag {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #ffffff;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 700;
    }

    .pricing-card:hover, .pricing-card.selected {
      border-color: var(--accent-pink);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(236, 72, 153, 0.25);
    }

    .pricing-card h4 {
      font-size: 1.25rem;
      margin: 0 0 12px 0;
      font-weight: 700;
    }

    .pricing-card .price {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
      letter-spacing: -0.03em;
    }

    .pricing-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
    }

    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-bottom: 90px;
    }

    .testimonial-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      padding: 35px 30px;
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .testimonial-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
    }

    .testimonial-card p {
      font-size: 1.05rem;
      color: var(--text-main);
      font-weight: 400;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .testimonial-card h4 {
      color: #f472b6;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0;
      text-transform: uppercase;
    }

    .trust-badges {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 80px;
    }

    .trust-badge-item {
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }

    .trust-badge-item:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
    }

    .trust-badge-item .icon {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .trust-badge-item h5 {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      margin: 0 0 6px 0;
    }

    .trust-badge-item p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 0;
    }

    .order-box {
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      border-radius: 30px;
      padding: 40px 25px;
      backdrop-filter: blur(25px);
      position: relative;
      text-align: center;
      max-width: 700px;
      margin: 0 auto 90px auto;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }

    @media (min-width: 768px) {
      .order-box {
        padding: 60px 50px;
      }
    }

    .dynamic-price-tag {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 25px;
      letter-spacing: -0.03em;
    }

    .commission-form {
      text-align: left;
      background: rgba(12, 14, 20, 0.7);
      border: 1px solid var(--border-gradient);
      padding: 25px 20px;
      border-radius: 20px;
      margin-bottom: 30px;
    }

    @media (min-width: 768px) {
      .commission-form {
        padding: 35px;
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-group textarea, .form-group input, .form-group select {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-gradient);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      resize: vertical;
      transition: border-color 0.3s ease;
    }

    .form-group select option {
      background: #12141c;
      color: #ffffff;
    }

    .form-group textarea:focus, .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent-pink);
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 18px 0;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      text-decoration: none;
      letter-spacing: 0.5px;
      border: none;
    }

    .whatsapp-btn {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(236, 72, 153, 0.5);
    }

    .payment-modal {
      display: none;
      position: fixed;
      z-index: 3000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 11, 14, 0.95);
      backdrop-filter: blur(20px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .payment-modal.active {
      display: flex;
    }

    .payment-box {
      background: var(--bg-card);
      border: 1px solid var(--accent-pink);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(236, 72, 153, 0.25);
      position: relative;
      animation: modalPopup 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    @keyframes modalPopup {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .payment-box h3 {
      font-size: 1.6rem;
      margin-top: 0;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .payment-box p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .revolut-popup-btn {
      background: #ffffff;
      color: #000000;
      margin-bottom: 12px;
    }

    .revolut-popup-btn:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
    }

    .close-popup-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-gradient);
    }

    .close-popup-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .faq-container {
      max-width: 750px;
      margin: 0 auto 90px auto;
    }

    .faq-item {
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      transition: border-color 0.3s ease;
    }

    .faq-item.active {
      border-color: var(--border-hover);
    }

    .faq-question {
      padding: 22px 25px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.98rem;
    }

    .faq-question span {
      color: #f472b6;
      font-size: 1.4rem;
      font-weight: 400;
      transition: transform 0.3s ease;
    }

    .faq-item.active .faq-question span {
      transform: rotate(45deg);
    }

    .faq-answer {
      padding: 0 25px 22px 25px;
      color: var(--text-muted);
      display: none;
      font-size: 0.92rem;
    }

    .faq-item.active .faq-answer {
      display: block;
    }

    .online-badge {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-gradient);
      padding: 8px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(15px);
      z-index: 1000;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .online-dot {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .floating-whatsapp {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #ffffff;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 30px rgba(236, 72, 153, 0.4);
      z-index: 1000;
      text-decoration: none;
      font-size: 26px;
      transition: transform 0.3s ease;
    }

    .floating-whatsapp:hover {
      transform: scale(1.08);
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-top: 1px solid var(--border-gradient);
    }
  </style>
</head>
<body>

  <div class="online-badge">
    <div class="online-dot"></div>
    <span>Online &bull; 1-Hr Turnaround</span>
  </div>

  <header>
    <div class="badge">For Creators & Influencers</div>
    <h1>PixelPerfect <span>Retouch</span></h1>
    <p>Level up your Instagram feed with flawless edits, professional color grading, and lightning-fast delivery via WhatsApp.</p>
  </header>

  <div class="container">
    
    <div class="section-title">What Photoshop <span>Can Do</span></div>
    <div class="showcas
